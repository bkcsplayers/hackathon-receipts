server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Strip base path prefix if present — defense in depth:
    # container works with OR without upstream nginx rewrite
    location / {
        rewrite ^/admindashboard/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
